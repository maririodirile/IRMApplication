const GT=["I would not mind routine unchallenging work if the pay and pension prospects were good.","I like to test boundaries and get into areas where few have worked before.","I tend not to like to stand out or be unconventional.","Capable people who fail to become successful have not usually taken chances when they have occurred.","I rarely day dream.","I find it difficult to switch off from work completely.","You are either naturally good at something or you are not, effort makes no difference.","Sometimes people find my ideas unusual.","I would rather buy a lottery ticket than enter a competition.","I like challenges that stretch my abilities and get bored with things I can do quite easily.","I would prefer to have a moderate income in a secure job rather than a high income in a job that depended on my performance.","At work, I often take over projects and steer them my way without worrying about what other people think.","Many of the bad times that people experience are due to bad luck.","Sometimes I think about information almost obsessively until I come up with new ideas and solutions.","If I am having problems with a task I leave it, forget it and move on to something else.","When I make plans I nearly always achieve them.","I do not like unexpected changes to my weekly routines.","If I wanted to achieve something and the chances of success were 50/50 I would take the risk.","I think more of the present and past than of the future.","If I had a good idea for making some money, I would be willing to invest my time and borrow money to enable me to do it.","I like a lot of guidance to be really clear about what to do in work.","People generally get what they deserve.","I am wary of new ideas, gadgets and technologies.","It is more important to do a job well than to try to please people.","I try to accept that things happen to me in life for a reason.","Other people think that I'm always making changes and trying out new ideas.","If there is a chance of failure I would rather not do it.","I get annoyed if people are not on time for meetings.","Before I make a decision I like to have all the facts no matter how long it takes.","I rarely need or want any assistance and like to put my own stamp on work that I do.","You are not likely to be successful unless you are in the right place at the right time.","I prefer to be quite good at several things rather than very good at one thing.","I would rather work with a person I liked who was not good at the job, rather than work with someone I did not like even if they were good at the job.","Being successful is a result of working hard, luck has little to do with it.","I prefer doing things in the usual way rather than trying out new methods.","Before making an important decision I prefer to weigh up the pro's and con's fairly quickly rather than spending a long time thinking about it.","I would rather work on a task as part of a team rather than take responsibility for it myself.","I would rather take an opportunity that might lead to even better things than have an experience that I am sure to enjoy.","I usually do what is expected of me and follow instructions carefully.","For me, getting what I want is a just reward for my efforts.","I like to have my life organised so that it runs smoothly and to plan.","When I am faced with a challenge I think more about the results of succeeding than the effects of failing.","I believe that destiny determines what happens to me in life.","I like to spend time with people who have different ways of thinking.","I find it difficult to ask for favours from other people.","I get up early, stay late or skip meals if I have a deadline for some work that needs to be done.","What we are used to is usually better than what is unfamiliar.","I get annoyed if superiors or colleagues take credit for my work.","People's failures are rarely the result of their poor judgement.","Sometimes I have so many ideas that I feel pressurised.","I find it easy to relax on holiday and forget about work.","I get what I want from life because I work hard to make it happen.","It is harder for me to adapt to change than keep to a routine.","I like to start interesting projects even if there is no guaranteed payback for the money or time I have to put in."];

const IRL=[{"k":"customer","n":"Customer Readiness","c":"CRL","a":"How well do you understand, reach, and serve your target customers? This goes from having a vague idea of who might need your service, all the way to running a thriving, growing customer base.","q":["I have an idea of who might need my service (e.g. homeowners, municipalities, businesses) but I haven’t yet spoken to real potential customers to test whether my idea is right.","I’ve had at least 5 real conversations with potential customers in the IRM sector (building owners, facility managers, government departments) and they’ve confirmed the problem exists.","I’ve drawn up a clear picture of my ideal customer — who they are, what they struggle with, and what it would cost them to pay for my solution. I’ve mapped their journey.","I’ve shown my service concept to at least 10 potential customers and some have given me a letter of intent, a verbal commitment, or agreed to pilot with me.","I have at least 3 paying customers who have paid me for real work. I have invoices or receipts to prove it and I’m learning what they like and don’t like.","I have 10 or more active paying customers, I’m getting repeat work or referrals, and I’ve tested my pricing to make sure it’s competitive and profitable.","I have 30 or more customers, a steady revenue stream coming in every month, and I’m actively looking at serving new types of customers or new areas.","I have 50+ customers across more than one area or region, I use a system to manage customer information and follow-ups, and my customer base is growing consistently.","I’m recognised as a leader in my trade in my region. I earn R1 million+ per month from 100+ active contracts. New customers come to me — I don’t need to chase them."],"s":["Hypothesis","Interviews","Insight","Validated","Transactions","Market-ready","Growth","Scaling","Leader"]},{"k":"technology","n":"Solution Readiness","c":"TRL","a":"In KTH’s framework, ‘Technology’ means your solution — the service or product you deliver. This tracks how well-developed, tested, and proven your service is, from an idea on paper to a fully certified, repeatable operation.","q":["I have a clear idea of what service I want to offer (e.g. electrical installations, solar PV, plumbing) but I haven’t yet delivered it to a real client.","I’ve written down exactly how I would deliver my service — what tools I need, what steps I follow, what the output looks like, and what standards apply (e.g. SANS, SABS).","I’ve demonstrated my service in a training or workshop environment and proven that the concept works, even if not yet with a paying client.","I’ve delivered my service to a real client in a real environment (even if at a reduced rate or as a trial) and the results met the basic quality standard.","I’ve delivered my service to multiple paying clients and the work consistently meets the required standard. I’ve started using quality checklists.","I can deliver my service end-to-end, on spec, on time. I’m MERSETA or SESSA compliant. My tools, suppliers, and processes are tested and reliable.","I’ve delivered this service many times across multiple clients. The quality is consistent and repeatable. I’ve started working toward formal certification (ISO, SANS, etc.).","My service is certified (MERSETA NQF, SESSA, SAQA or equivalent). I have written SOPs. Other team members can deliver the service the same way I do.","My service is fully standardised, certified, and proven across 3 or more locations. I have proprietary delivery toolkits or SOPs that give me a competitive edge."],"s":["Basic idea","Concept","Demo","First delivery","Multi-client","End-to-end","Consistent","Certified","Proven scale"]},{"k":"business","n":"Business Model Readiness","c":"BRL","a":"A sustainable business model means: revenue exceeds costs AND your business creates more positive impact than negative for the environment and society. This axis tracks how developed, tested, and proven your business model is.","q":["I have a rough idea of how I could make money from my service but I haven’t worked out the numbers or formally described my business model.","I can describe my business model informally: what I sell, to whom, at roughly what price, and what my main costs are. I’ve thought about whether it could be sustainable.","I’ve completed a basic Business Model Canvas. I’ve estimated whether revenue will cover costs and I’ve thought about the positive environmental or social value my business creates.","I’ve built a basic financial model — I know my break-even point, I’ve estimated 12-month revenue and costs, and I’ve started measuring my social or environmental contribution.","I’ve tested my business model against real market feedback and real costs. My numbers are realistic. I pay fair wages and use responsible materials or methods.","My revenue has exceeded my costs for at least 3 months in a row. My business is registered with CIPC, I use proper bookkeeping, and I can show proof of sustainability.","My business model has been sustainable for 6+ months. I produce formal financial statements, I’m VAT-registered if applicable, and I measure and report my social/environmental contribution.","I continuously improve my business model. I’m pursuing green certification and B-BBEE compliance and I report my ESG (environmental, social, governance) contribution to funders.","My business has been financially sustainable for 2+ years. I’m audited annually, B-BBEE Level 1–2, VAT-registered, and my positive impact clearly outweighs any negative contributions."],"s":["Value idea","Described","BM Canvas","Modelled","Tested","Revenue+","6mo validated","Optimised","Sustained scale"]},{"k":"ipr","n":"IPR Readiness","c":"IPRL","a":"IPR (Intellectual Property Rights) in an IRM business includes your brand, service methods, trade knowledge, supplier relationships, and any unique processes. This axis tracks how well you’ve identified and protected what makes your business unique.","q":["I know that things like my business name, my methods of working, and my knowledge are forms of intellectual property — but I haven’t done anything to identify or protect them yet.","I’ve made a list of my key intellectual property assets: my business name, how I deliver my service, any special processes or tools I use, and my key customer or supplier relationships.","I’ve assessed which of my IP is most valuable and most at risk, and I’ve checked whether anyone else has registered a similar name or process that could affect me.","I’ve drafted a simple IPR protection plan — what I want to protect, how (e.g. trademark, trade secret, copyright), in what order of priority. I’ve spoken to a lawyer or IP advisor about it.","I’ve taken active steps: I’ve filed my business name or trademark with CIPC, I’ve written down my key trade secrets and limited who can access them, and I use NDAs with staff and partners.","My core intellectual property is formally protected. My trademark is registered (if applicable), my service manuals are classified as confidential IP, and my contracts include IP protection clauses.","My brand and protected methods are giving me a real competitive advantage in the market. Clients recognise my name and my differentiated approach. My IP is actively working for my business.","I actively manage an IP portfolio. I’ve considered or am pursuing licensing or franchising my methods. My IP is included in my business valuation documents.","My brand trademark is registered, my proprietary service methodology is legally protected, and I actively license or franchise my IP. My IP is a core business asset with a measurable value."],"s":["Aware","Identified","Assessed","Strategy draft","Initiated","Protected","Leveraged","Portfolio","IP drives value"]},{"k":"team","n":"Team Readiness","c":"TMRL","a":"This axis looks at whether you have the right people with the right skills to deliver and grow your business. It starts with just you (the founder) and grows to a full organisation with management layers.","q":["It’s mainly just me right now. I’m committed to building this business. I have a relevant trade qualification or skill (e.g. I’m a qualified electrician or plumber).","I know what skills my business needs beyond my own. I’ve identified the gaps and I’ve informally connected with advisors, mentors, or other people who can help.","There are 1–2 of us working on this. Between us, we cover the key skills needed and we share the same vision for where the business is going.","Our founding team can validate the business idea and handle early delivery. We each know our roles, even if informally, and we’re all genuinely committed.","We are a team of at least 2 people with formal, agreed roles. We’ve signed a partnership or shareholder agreement. We’ve thought about team diversity (gender, age, skills).","Our team can handle current contracts AND develop the business at the same time. We’ve hired or committed our first employee. We’ve started complying with UIF and COIDA.","We have 5 or more employees. Management responsibilities are starting to spread beyond the founder. We have proper HR systems: employment contracts, leave management, payroll.","We have a formal organisational structure with a leadership team across different functions. We have a plan for what happens if key people leave (succession planning).","We have 10+ full-time employees. Our team is diverse (gender, youth, disability-inclusive). We have full HR compliance, a management layer, and a succession plan in place."],"s":["Founder","Skills mapped","Core team","Validated","Formal roles","Capacity","Scaling","Org built","Full org"]},{"k":"funding","n":"Funding Readiness","c":"FRL","a":"This axis tracks how ready your business is to access, absorb, and grow through funding — from the first small grant to large investment rounds and commercial credit. It also tracks your financial management maturity.","q":["I know I’ll need money to develop my idea. I’ve made a rough estimate of how much I need to get started. I know some IRM funding options exist (like IRM Hub grants or NYDA) but haven’t applied yet.","I’ve researched the main funding options for IRM businesses: IRM Hub grants, SEDA, NEF, NYDA, B-BBEE funds. I’ve committed some of my own money (savings or personal loan) to the idea.","I’ve secured between R5,000 and R15,000 (from personal savings, family, an IRM pre-incubation grant, or NYDA microloan) to validate my idea. I have a basic budget.","My entire validation phase is funded. I track my spending and income. I have basic bookkeeping in place. I have enough money to test and confirm whether my business model works.","I’ve secured between R50,000 and R150,000 (from a SEDA or NEF loan, IRM incubation grant, or first real revenue) to fund my development phase. I have an accounting system.","I’ve secured between R150,000 and R500,000 from a mix of sources (grants, revenue, and a loan). I have auditable financial records and I’ve prepared a basic investor pitch.","I’ve secured R500,000 or more. My financial sustainability is demonstrated. I have the financial track record needed to access performance bonds for larger contracts.","I have access to commercial bank credit. I maintain a 24-month financial forecast. My balance sheet is investment-grade and I’m actively building an investor network.","My business is financially self-sustaining with R2M+ annual revenue. I have access to commercial credit facilities and a strong balance sheet that makes me bondable for major contracts."],"s":["Need ID","Researched","Secured R5-15k","Val funded","Dev funded","Growth funded","Scaling capital","Invest-grade","Self-sustaining"]}];

const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ST={e:{},f:{},t:{},r:{},i:{},b:{},ok:false,step:0,code:''};
try{const s=JSON.parse(localStorage.getItem('irm-form-v3')||'null');if(s)ST=Object.assign(ST,s)}catch(_){}
function sv(){try{localStorage.setItem('irm-form-v3',JSON.stringify(ST))}catch(_){}}
const F=(l,k,t='text')=>`<label id="m-f-${k}" class="${TRY&&need(1).includes('f-'+k)?'miss':''}">${l}<input type="${t}" value="${e(ST[k])}" oninput="ST.${k}=this.value;sv()"></label>`;
const Sl=(l,k,o)=>`<label>${l}<select onchange="ST.${k}=this.value;sv()">${o.map(x=>{const[v,t]=Array.isArray(x)?x:[x,x];return `<option value="${v}" ${ST[k]===v?'selected':''}>${t}</option>`}).join('')}</select></label>`;
function cnt(){return{e:Object.keys(ST.e).length,t:Object.keys(ST.t).length,r:Object.keys(ST.r).length,i:Object.keys(ST.i).length,b:Object.keys(ST.b).length}}
function go(n){TRY=false;SO=false;ST.step=n;sv();render();scrollTo(0,0)}
function nx(){const m=need(ST.step);if(m.length){TRY=true;render();setTimeout(()=>{const el=document.querySelector('.miss');if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'})},0);return}go(ST.step+1)}
function pick(m,k,v){ST[m][k]=v;sv();render()}
function undoNo(){Object.keys(ST.e).forEach(k=>{if(ST.e[k]==='0')delete ST.e[k]});sv();render()}
function render(){const c=cnt(),s=ST.step;$('#pb').style.width=(s/LAST*100)+'%';
if(Object.values(ST.e).includes('0')){$('#pb').style.width='0';$('#app').innerHTML=`<div class="card"><h2>This programme is not the right fit right now</h2><p>Thank you for your interest. This programme is open to enterprises that meet all seven minimum requirements in the quick check, and your answers show that one or more are not yet met. Your answers have not been sent to NBI.</p><p>Please create or complete your user profile on the IRM Hub MSME portal instead.</p><p><a class="btn" style="display:inline-block;text-decoration:none" href="https://portal.irmhub.org.za" target="_blank" rel="noopener">Go to the IRM Hub MSME portal</a></p><p class="hint"><a href="#" onclick="undoNo();return false">I tapped No by mistake: go back and change my answers</a></p></div>`;return}
let b='';
if(s===0)b=`<div class="card"><h2> Submit your Application</h2><p>The National Business Initiative and Majuba TVET College, invites the following MSMEs:</p>

<p>MSMEs that are already active in insurance brokers, insurers, or claims-supply panels but need capability
       and capacity to increase their work volumes.</p>
<p>MSMEs that possess practical trade experience but remain excluded from these panels and require broker
      and market linkages
MSMEs that have adopted self-created growth strategies to create employment outside insurance panel based markets.</p><p> Based in Newcastle, Madadeni, Osizweni and the wider Majuba TVET College area.</p>Support includes training, coaching, technical assistance, networking, market linkages for growth orientated MSMEs.</p><p>This form takes about 50 minutes. Every question must be answered. It has your business details, your personal and business profile, two questionnaires about how you work, and a six-part readiness diagnostic and a business diagnostic. There are no right or wrong answers; please answer honestly. Your progress is saved on this device.</p><p class="hint">Completing this form does not guarantee selection. Shortlisted enterprises will be contacted for a site visit.</p><h3>Quick check</h3><p class="hint">Please answer for your business.</p>${EL.map(([k,t],i)=>`<div id="m-e${i}" class="${TRY&&ST.e[i]===undefined?'miss':''}">${t}<div class="q">${[['Yes','1'],['No','0']].map(([l,v])=>`<button class="${ST.e[i]===v?'on':''}" onclick="pick('e',${i},'${v}')">${l}</button>`).join('')}</div></div>`).join('')}</div>`;
if(s>=1&&s<=4)b=secHTML(SEC[s-1]);
if(s===5)b=`<div class="card"><h2>Enterprising tendency</h2><p class="hint">Do you agree or disagree with each statement? ${c.t}/54 answered.</p>${GT.map((t,i)=>`<div id="m-t${i+1}" class="${TRY&&!ST.t[i+1]?'miss':''}"><span class="hint">${i+1}.</span> ${t}<div class="q">${[['Agree','A'],['Disagree','D']].map(([l,v])=>`<button class="${ST.t[i+1]===v?'on':''}" onclick="pick('t',${i+1},'${v}')">${l}</button>`).join('')}</div></div>`).join('')}</div>`;
if(s===6)b=`<div class="card"><h2>Grit</h2><p class="hint">How much does each statement describe you? ${c.r}/12 answered.</p>${GR.map(([t],i)=>`<div id="m-r${i+1}" class="${TRY&&!ST.r[i+1]?'miss':''}"><span class="hint">${i+1}.</span> ${t}<div class="q">${GL.map((l,v)=>`<button class="${ST.r[i+1]===v+1?'on':''}" onclick="pick('r',${i+1},${v+1})">${l}</button>`).join('')}</div></div>`).join('')}</div>`;
if(s===7){const sum=irlDone()?(()=>{return`<div class="card"><h3>Your readiness profile</h3><p class="hint">Where your business is today in each of the six areas.</p>${IRL.map(a=>{const v=ST.i[a.k];return`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;gap:10px;font-size:13px"><span>${a.n}</span><span class="hint">L${v}: ${e(a.s[v-1])}</span></div><div class="bar"><i style="width:${v/9*100}%"></i></div></div>`}).join('')}<p class="hint">This is based on your own answers. It is a snapshot, not a score.</p></div>`})():'';
b=`<div class="card"><h2>IRL Diagnostic</h2><p class="hint">KTH Innovation Readiness Level™. For each of the six areas below, choose the one statement that best describes your business right now. Choose the highest level you can honestly say yes to. There are no wrong answers. ${c.i}/6 answered.</p><p class="hint">Adapted from the KTH Innovation Readiness Level™ (© KTH Innovation, CC BY-NC-SA, kthinnovationreadinesslevel.com).</p></div>`+IRL.map((a,n)=>`<div class="card"><div id="m-i${a.k}" class="${TRY&&!ST.i[a.k]?'miss':''}"><h3>${n+1}. ${a.n} (${a.c})</h3><p class="hint">${e(a.a)}</p><div class="irl">${a.q.map((t,j)=>`<button type="button" class="opt ${ST.i[a.k]===j+1?'on':''}" onclick="pick('i','${a.k}',${j+1})"><b>L${j+1}</b><span>${e(t)}</span></button>`).join('')}</div></div></div>`).join('')+sum}
if(s===8){let n=0;b=`<div class="card"><h2>Business diagnostic</h2><p class="hint">How true is each statement for your business today? ${c.b}/24 answered.</p>${BD.map(g=>`<h3>${e(g[0])}</h3>${g[1].map(t=>{n++;const k=n;return`<div id="m-b${k}" class="${TRY&&ST.b[k]===undefined?'miss':''}">${e(t)}<div class="q">${BDO.map((l,v)=>`<button class="${ST.b[k]===v?'on':''}" onclick="pick('b',${k},${v})">${e(l)}</button>`).join('')}</div></div>`}).join('')}`).join('')}</div>`}
if(s===LAST){const all=STEPS.slice(0,LAST).map((t,k)=>[k,t,need(k).length]),left=all.filter(x=>x[2]);
b=`<div class="card"><h2>Review and submit</h2>${ST.sent?`<h3>Thank you</h3>${ST.sent==='file'?`<p>Your application is ready. It is not submitted until NBI receives the code below. Tap the email button, or copy the code and send it as one message to ${NBI_EMAILS.join(' and ')}, or to the NBI contact who gave you this link by WhatsApp.</p><textarea readonly id="cd" onclick="this.select()">${e(ST.code)}</textarea><p><a class="btn" style="display:inline-block;text-decoration:none" href="mailto:${NBI_EMAILS.join(',')}?subject=${encodeURIComponent('IRM application: '+(ST.f.B1||''))}&body=${encodeURIComponent('My application code:\n\n'+ST.code)}">Email my application to NBI</a> <button class="btn s" onclick="cpy()">Copy code</button> <span id="cpm" class="hint"></span></p>`:'<p>Your application has been submitted to NBI. Shortlisted enterprises will be contacted for a site visit.</p>'}`:`${all.map(x=>`<p>${x[1]}: <b class="${x[2]?'bad':'ok'}">${x[2]?x[2]+' unanswered':'complete'}</b> ${x[2]?`<a href="#" onclick="go(${x[0]});return false">complete</a>`:''}</p>`).join('')}${left.length?'<p class="hint">Please answer every question to continue.</p>':`<label style="flex-direction:row;gap:8px;align-items:flex-start;color:var(--ink)"><input type="checkbox" ${ST.ok?'checked':''} onchange="ST.ok=this.checked;sv();render()"> I confirm my answers are true and I consent to NBI and Majuba TVET College processing my information for this programme, in line with POPIA.</label><button class="btn" ${ST.ok&&!BUSY?'':'disabled'} onclick="submitApp()">${BUSY?'Submitting…':'Submit application'}</button>`}${ERR?`<p class="bad">${e(ERR)}</p>`:''}`}<p class="hint"><a href="#" onclick="cfa();return false">${SO?'Click again to clear all answers on this device':'Start over'}</a></p></div>`}
$('#app').innerHTML=(TRY&&s<LAST&&need(s).length?`<p class="bad"><b>Please answer every question (${need(s).length} left).</b> Unanswered questions are marked in red.</p>`:'')+b+`<div class="nav"><button class="btn s" ${s?'':'style="visibility:hidden"'} onclick="go(${s-1})">Back</button>${s<LAST?`<button class="btn" onclick="nx()">${s?'Next':'Start'}</button>`:''}</div><p class="hint" style="text-align:center">${STEPS[s]} · step ${s+1} of ${STEPS.length}</p>`}
const $=q=>document.querySelector(q);
function payload(){const f={};SEC.forEach(s=>s.g.forEach(g=>g.q.forEach(x=>{if(vis(x)&&ans(x))f[x.id]=ST.f[x.id]})));
if(f['B10.5']==='Yes'){const mp={B11:'L3',B12:'L1.1',B13:'L1',B14:'L4',B15:'L6',B16:'L7',B17:'L8'};Object.keys(mp).forEach(k=>{if(f[mp[k]]!==undefined)f[k]=f[mp[k]]});if(f.L2)f.B18=f.L2.replace('settlement','Settlement')}
const own=((f.P2||'')+' '+(f.P3||'')).trim(),pr=f.P8,ag=f.P6,dob=Date.parse(f.P5),
yo=dob?(Date.now()-dob)/315576e5<=35:['Under 18','18-23','24-29','30-35'].includes(ag),
adr=((f.B13||'')+' '+(f.L1||'')).toLowerCase(),ar=['Madadeni','Osizweni','Newcastle'].find(t=>adr.includes(t.toLowerCase()))||'Other Majuba',
sv_=f.B10||'',tr=['Plumbing','Electrical','Carpentry'].find(t=>sv_.includes(t))||'Other';
return{v:2,i:Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:new Date().toISOString(),n:f.B1||own,o:own,em:f.P14||f.B8||'',ph:f.P13||f.P16||f.B7||'',g:pr==='She/Her'?'F':pr==='He/Him'?'M':'O',y:yo?1:0,a:ar,tr,e:EL.map((_,i)=>ST.e[i]||'-').join(''),t:GT.map((_,i)=>ST.t[i+1]||'-').join(''),r:GR.map((_,i)=>ST.r[i+1]||'-').join(''),irl:irlPayload(),bd:BDQ.map((_,i)=>ST.b[i+1]===undefined?'-':ST.b[i+1]).join(''),f}}
async function mkCode(o){const F=o.f||{},I=o.irl||{},t=x=>encodeURIComponent(x==null?'':x);
return'IRM3.'+[o.i,(o.at||'').slice(0,10),o.n,o.o,o.em,o.ph,o.g,o.y,o.a,o.tr,o.e,o.t,o.r,[I.crl,I.trl,I.brl,I.iprl,I.tmrl,I.frl].join(''),o.bd,F.B5,F.O9,F.O11,F.B20,F.O5,F.B21].map(t).join('|')}
async function cpy(){const t=document.getElementById('cd');t.select();let ok=false;try{await navigator.clipboard.writeText(t.value);ok=true}catch(_){try{ok=document.execCommand('copy')}catch(_){}}const m=document.getElementById('cpm');if(m)m.textContent=ok?'Copied.':'Select the code and copy it manually.'}
let SO=false;function cfa(){if(SO){try{localStorage.removeItem('irm-form-v3')}catch(_){}location.reload()}else{SO=true;render()}}
async function submitApp(){const o=payload();ERR='';
if(!SUBMIT_URL){try{ST.code=await mkCode(o);ST.sent='file'}catch(_){ERR='Could not prepare your application on this device.'}
try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download='IRM-application-'+o.i+'.json';document.body.appendChild(a);a.click();a.remove()}catch(_){}
sv();render();return}
BUSY=true;render();
try{await fetch(SUBMIT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},o,{code:await mkCode(o)}))});ST.sent=true}catch(_){ERR='Could not send your application. Check your internet connection and try again.'}
BUSY=false;sv();render()}
render();
