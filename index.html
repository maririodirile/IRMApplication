<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Newcastle IRM Enterprise Programme – Application</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#f3f7f6;--card:#fff;--ink:#1b2227;--mut:#5c6b70;--line:#dbe5e3;--brand:#005e6a;--on:#fff;--head:#1f9d55;--green:#3faa24;--cyan:#02bbcc;--grad:linear-gradient(90deg,#3faa24,#02bbcc);--bad:#b3392f;--ok:#1f8a4c;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#11191c;--card:#1a2528;--ink:#e6eef0;--mut:#9db0b5;--line:#2c3c40;--brand:#22b8c5;--on:#0b1416;--head:#4fcf86;--bad:#ef7b70;--ok:#5cc58a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#11191c;--card:#1a2528;--ink:#e6eef0;--mut:#9db0b5;--line:#2c3c40;--brand:#22b8c5;--on:#0b1416;--head:#4fcf86;--bad:#ef7b70;--ok:#5cc58a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Poppins,system-ui,sans-serif}
h1,h2,h3{font-family:Poppins,system-ui,sans-serif;font-weight:600;margin:.3em 0;line-height:1.3}
h2{color:var(--head);font-size:22px}h3{font-size:17px}
.top{background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid #e3e9e8}
.top img{display:block;height:44px;width:auto}.top img.nbi{height:38px}
.hero{background:linear-gradient(135deg,#1b2227 0%,#2b3b41 60%,#24434a 100%);color:#fff;padding:18px 16px 14px}
.hero small{color:#5fd6e0;font-weight:500;letter-spacing:.02em}.hero h1{font-size:21px;color:#fff;margin:2px 0 12px}
.pr{height:6px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}.pr i{display:block;height:100%;background:var(--grad);transition:width .3s}
.tabs{position:relative;display:flex;gap:6px;overflow-x:auto;margin:12px -16px -4px;padding:0 16px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tabs:empty{display:none}
.tabs button{flex:none;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);color:#d3dde0;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 13px 6px 6px;font:500 13px Poppins,sans-serif;cursor:pointer;white-space:nowrap}
.tabs button span{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:11px;font-weight:600}
.tabs button.done span{background:var(--green)}
.tabs button.cur{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}.tabs button.cur span{background:#fff;color:#1b2227}
.tabs button:disabled{opacity:.4;cursor:default}
.tabs button:not(:disabled):not(.cur):hover{border-color:#5fd6e0}
main{max-width:780px;margin:0 auto;padding:18px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(16,40,44,.05)}
.card ul{padding-left:20px;margin:6px 0 12px}.card li{margin:4px 0}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px;margin:10px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:0;border-color:transparent}
input[type=checkbox]{accent-color:var(--brand)}
.q{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}.q button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 15px;cursor:pointer;font:inherit;font-size:14px}.q button:hover{border-color:var(--brand)}.q button.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
.btn{background:var(--grad);color:#fff;border:0;border-radius:999px;padding:12px 26px;font:600 15px Poppins,sans-serif;cursor:pointer;box-shadow:0 3px 10px rgba(2,187,204,.25)}.btn.s{background:none;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none}.btn:disabled{opacity:.4;cursor:default}
.nav{display:flex;justify-content:space-between;gap:10px;margin:8px 0 24px}
.hint{color:var(--mut);font-size:13px}.bad{color:var(--bad)}.ok{color:var(--ok)}
a{color:var(--brand)}
textarea{width:100%;min-height:110px;font-family:ui-monospace,monospace;font-size:12px}
.miss{border-left:3px solid var(--bad);padding-left:8px;margin-left:-11px}
.irl{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;font-size:14px;line-height:1.5}
.opt:hover{border-color:var(--brand)}
.opt b{flex:none;font:600 12px ui-monospace,monospace;color:var(--mut);min-width:24px;padding-top:2px}
.opt.on{background:var(--brand);color:var(--on);border-color:var(--brand)}.opt.on b{color:var(--on)}
.err{color:var(--bad);font-size:12px}.err:empty{display:none}
.ac{position:relative}.acl{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.15);overflow:hidden}.acl:empty{display:none}
.acl button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px;padding:10px 12px;cursor:pointer}.acl button:last-child{border-bottom:0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grad)}
.rh{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:8px 0 6px}.rn{font:700 64px/1 Poppins,sans-serif;color:var(--brand);white-space:nowrap}.rn span{font-size:22px;color:var(--mut);font-weight:500;margin-left:6px}.rhb{flex:1;min-width:220px}.rb{display:inline-block;background:var(--grad);color:#fff;font-weight:600;font-size:17px;padding:5px 16px;border-radius:999px}.rt{font-size:18px;line-height:1.5;margin:10px 0 0}
.fx{background:color-mix(in srgb,var(--cyan) 9%,var(--card));border:1px solid var(--line);border-left:5px solid var(--cyan);border-radius:12px;padding:16px 18px;margin:16px 0}.fx h4{font-size:20px;margin:0 0 6px}.fx ul{margin:0;padding-left:20px}.fx li{font-size:17px;margin:10px 0}.fx li small{font-weight:500;color:var(--mut);font-size:14px}.fx li span{display:block;font-size:15.5px;color:var(--ink);opacity:.85;margin-top:2px}.fxn{font-size:17px;margin:4px 0 0}.rs{font-size:16px;margin:18px 0 4px}
</style></head><body>

e or product you deliver. This tracks how well-developed, tested, and proven your service is, from an idea on paper to a fully certified, repeatable operation.","q":["I have a clear idea of what service I want to offer (e.g. electrical installations, solar PV, plumbing) but I haven’t yet delivered it to a real client.","I’ve written down exactly how I would deliver my service — what tools I need, what steps I follow, what the output looks like, and what standards apply (e.g. SANS, SABS).","I’ve demonstrated my service in a training or workshop environment and proven that the concept works, even if not yet with a paying client.","I’ve delivered my service to a real client in a real environment (even if at a reduced rate or as a trial) and the results met the basic quality standard.","I’ve delivered my service to multiple paying clients and the work consistently meets the required standard. I’ve started using quality checklists.","I can deliver my service end-to-end, on spec, on time. I’m MERSETA or SESSA compliant. My tools, suppliers, and processes are tested and reliable.","I’ve delivered this service many times across multiple clients. The quality is consistent and repeatable. I’ve started working toward formal certification (ISO, SANS, etc.).","My service is certified (MERSETA NQF, SESSA, SAQA or equivalent). I have written SOPs. Other team members can deliver the service the same way I do.","My service is fully standardised, certified, and proven across 3 or more locations. I have proprietary delivery toolkits or SOPs that give me a competitive edge."],"s":["Basic idea","Concept","Demo","First delivery","Multi-client","End-to-end","Consistent","Certified","Proven scale"]},{"k":"business","n":"Business Model Readiness","c":"BRL","a":"A sustainable business model means: revenue exceeds costs AND your business creates more positive impact than negative for the environment and society. This axis tracks how developed, tested, and proven your business model is.","q":[ at things like my business name, my methods of working, and my knowledge are forms of intellectual property — but I haven’t done anything to identify or protect them yet.","I’ve made a list of my key intellectual property assets: my business name, how I deliver my service, any special processes or tools I use, and my key customer or supplier relationships.","I’ve assessed which of my IP is most valuable and most at risk, and I’ve checked whether anyone else has registered a similar name or process that could affect me.","I’ve drafted a simple IPR protection plan — what I want to protect, how (e.g. trademark, trade secret, copyright), in what order of priority. I’ve spoken to a lawyer or IP advisor about it.","I’ve taken active steps: I’ve filed my business name or trademark with CIPC, I’ve written down my key trade secrets and limited who can access them, and I use NDAs with staff and partners.","My core intellectual property is formally protected. My trademark is registered (if applicable), my service manuals are classified as confidential IP, and my contracts include IP protection clauses.","My brand and protected methods are giving me a real competitive advantage in the market. Clients recognise my name and my differentiated approach. My IP is actively working for my business.","I actively manage an IP portfolio. I’ve considered or am pursuing licensing or franchising my methods. My IP is included in my business valuation documents.","My brand trademark is registered, my proprietary service methodology is legally protected, and I actively license or franchise my IP. My IP is a core business asset with a measurable value."],"s":["Aware","Identified","Assessed","Strategy draft","Initiated","Protected","Leveraged","Portfolio","IP drives value"]},{"k":"team","n":"Team Readiness","c":"TMRL","a":"This axis looks at whether you have the right people with the right skills to deliver and grow your business. It starts with just you (the founder) and grows to a full organisation with management layers.","q":["It’s mainly just me right now. I’m committed to building this business. I have a relevant trade qualification or skill (e.g. I’m a qualified electrician or plumber).","I know what skills my business needs beyond my own. I’ve identified the gaps and I’ve informally connected with advisors, mentors, or other people who can help.","There are 1–2 of us working on this. Between us, we cover the key skills needed and we share the same vision for where the business is going.","Our founding team can validate the business idea and handle early delivery. We each know our roles, even if informally, and we’re all genuinely committed.","We are a team of at least 2 people with formal, agreed roles. We’ve signed a partnership or shareholder agreement. We’ve thought about team diversity (gender, age, skills).","Our team can handle current contracts AND develop the business at the same time. We’ve hired or committed our first employee. We’ve started complying with UIF and COIDA.","We have 5 or more employees. Management responsibilities are starting to spread beyond the founder. We have proper HR systems: employment contracts, leave management, payroll.","We have a formal organisational structure with a leadership team across different functions. We have a plan for what happens if key people leave (succession planning).","We have 10+ full-time employees. Our team is diverse (gender, youth, disability-inclusive). We have full HR compliance, a management layer, and a succession plan in place."],"s":["Founder","Skills mapped","Core team","Validated","Formal roles","Capacity","Scaling","Org built","Full org"]},{"k":"funding","n":"Funding Readiness","c":"FRL","a":"This axis tracks how ready your business is to access, absorb, and grow through funding — from the first small grant to large investment rounds and commercial credit. It also tracks your financial management maturity.","q":["I know I’ll need money to develop my idea. I’ve made a rough estimate of how much I need to get started. I know some IRM funding options exist (like IRM Hub grants or NYDA) but haven’t applied yet.","I’ve researched the main funding options for IRM businesses: IRM Hub grants, SEDA, NEF, NYDA, B-BBEE funds. I’ve committed some of my own money (savings or personal loan) to the idea.","I’ve secured between R5,000 and R15,000 (from personal savings, family, an IRM pre-incubation grant, or NYDA microloan) to validate my idea. I have a basic budget.","My entire validation phase is funded. I track my spending and income. I have basic bookkeeping in place. I have enough money to test and confirm whether my business model works.","I’ve secured between R50,000 and R150,000 (from a SEDA or NEF loan, IRM incubation grant, or first real revenue) to fund my development phase. I have an accounting system.","I’ve secured between R150,000 and R500,000 from a mix of sources (grants, revenue, and a loan). I have auditable financial records and I’ve prepared a basic investor pitch.","I’ve secured R500,000 or more. My financial sustainability is demonstrated. I have the financial track record needed to access performance bonds for larger contracts.","I have access to commercial bank credit. I maintain a 24-month financial forecast. My balance sheet is investment-grade and I’m actively building an investor network.","My business is financially self-sustaining with R2M+ annual revenue. I have access to commercial credit facilities and a strong balance sheet that makes me bondable for major contracts."],"s":["Need ID","Researched","Secured R5-15k","Val funded","Dev funded","Growth funded","Scaling capital","Invest-grade","Self-sustaining"]}];

irl(d){const v=IRL.map(a=>ST.i[a.k]||0);d.para('Your own rating of the business on six readiness areas, from level 1 (just starting) to level 9 (fully established). NBI may adjust these after the diagnostic and site visit. This is a snapshot of where you are today.');d.h2('Readiness levels');IRL.forEach(a=>{const l=ST.i[a.k]||0;d.bar(a.n+' ('+a.c+')',l,9,'Level '+l+' / 9');d.para(a.q[l-1]||'',8.5)});d.gap(4);d.para('Gap between your highest and lowest area: '+(Math.max(...v)-Math.min(...v))+' levels. Areas that are far apart usually show where to focus first.');d.para('Adapted from the KTH Innovation Readiness Level © KTH Innovation (CC BY-NC-SA), kthinnovationreadinesslevel.com',8)},
acc(d){const need=ACC.filter(accNeed);d.big(need.length+' of 7','areas where support is needed');d.para('Your answers to the MSME acceleration diagnostic. Areas marked support needed become priorities in your Enterprise Development Plan.');d.h2('All seven components');ACC.forEach(a=>{const v=ST.b[a.k],st=a.k==='gf'?(accNeed(a)?'Not yet finance-ready':'Finance-ready'):accNeed(a)?'Support needed':'In place';d.kv(a.n,st+' (answered '+(v||'-')+')');if(v===a.on)a.f.forEach((g,j)=>d.kv('   '+g[0],ST.b[a.k+j]||'-'))})}};
const pdfDate=()=>{const n=new Date();return n.getDate()+' '+['January','February','March','April','May','June','July','August','September','October','November','December'][n.getMonth()]+' '+n.getFullYear()};
function makePdf(keys){const nm=((ST.f.P2||'')+' '+(ST.f.P3||'')).trim(),full=keys.length>1,title=full?'Full application overview':DOCS.find(x=>x[0]===keys[0])[1];
const d=pdfDoc(title,['Applicant: '+nm,'Business: '+(ST.f.B1||'-'),'Reference: '+refCode(),'Date: '+pdfDate()]);
if(full){d.para('A copy of your answers to the Newcastle IRM Enterprise Programme application, for your records. Completing the application does not guarantee selection.');d.h2('Contents');DOCS.forEach(([,t],i)=>d.kv(String(i+1),t));const sc=score();d.h2('Your overall score');[['Verification checks',sc.v,6],['Enterprising tendency (GET2)',sc.get,54],['Grit',sc.grit,60],['IRL diagnostic',sc.irl,54],['Documented growth plans',sc.gp,GP_POINTS]].forEach(([l,v,m])=>d.bar(l,v,m,v+' / '+m));d.bar('Total',sc.total,SCORE_MAX.total,sc.total+' / '+SCORE_MAX.total)}
keys.forEach(k=>{if(full)d.section(DOCS.find(x=>x[0]===k)[1]);PDFC[k](d)});
return d.build('Newcastle IRM Enterprise Programme · Reference '+refCode()+' · Copy of your answers')}
render();
</script></body></html>
