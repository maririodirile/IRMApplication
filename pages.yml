name: Deploy application form to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/inject_config.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Optional repository secrets: SUBMIT_URL (Power Automate HTTP URL) and
      # PLACES_KEY (Google Places API key). Unset secrets leave the placeholders.
      - name: Inject configuration
        env:
          SUBMIT_URL: ${{ secrets.SUBMIT_URL }}
          PLACES_KEY: ${{ secrets.PLACES_KEY }}
        run: python3 scripts/inject_config.py public/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
